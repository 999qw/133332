# ============================================================
# 方案 C：从 CNB 仓库拉取最新页面，自动同步到 GitHub Pages
# 凭据（GITHUB_TOKEN）只存在于你自己的 GitHub 环境里，无需托管到 CNB
#
# 使用步骤：
# 1. 把本文件复制到你的 GitHub 线上站仓库（999qw/133332）：
#    .github/workflows/sync-from-cnb.yml
# 2. 提交后，GitHub Actions 会自动每天 04:00 UTC + 每次手动触发时，
#    从 CNB 仓库 buzhid/1 的 main 分支拉取 github_upload/ 覆盖到本仓库 main 分支。
#    由于你的 Pages 是「从 main 分支部署」，push 后 GitHub 会自动重新构建上线。
# 3. 想立即同步：打开仓库 Actions 页 → 左侧选本 workflow → Run workflow。
#
# 说明：
# - 无需配置任何密钥（用内置的 GITHUB_TOKEN 即可，默认权限足够）。
# - 不会动 CNAME / gitalk.css / gitalk.min.js 等文件，只覆盖这 3+1 个页面文件。
# - 拉取地址是 CNB 仓库的公开 HTTPS 地址，无需 CNB 凭据。
# ============================================================
name: sync-from-cnb

on:
  schedule:
    - cron: '0 4 * * *'        # 每天 04:00 UTC 自动同步一次
  workflow_dispatch:           # 也支持手动触发（Actions 页 → Run workflow）

permissions:
  contents: write              # 只给本仓库写入权限（无需 pages/id-token）

concurrency:
  group: sync-cnb
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 当前仓库（133332，含 CNAME）
        uses: actions/checkout@v4

      - name: 从 CNB 拉取最新页面（公开地址，无需凭据）
        run: |
          rm -rf /tmp/cnb-src
          git clone --depth 1 https://cnb.cool/buzhid/1.git /tmp/cnb-src
          # 覆盖页面文件（CNAME 等保留）
          cp -f /tmp/cnb-src/github_upload/index.html ./index.html
          cp -f /tmp/cnb-src/github_upload/data-jinshang.js ./data-jinshang.js
          cp -f /tmp/cnb-src/github_upload/data-suibi.js ./data-suibi.js
          rm -rf ./pictures
          cp -r /tmp/cnb-src/github_upload/pictures ./pictures
          # 清理临时克隆
          rm -rf /tmp/cnb-src

      - name: 校验文件已更新（打印文件大小，便于对照）
        run: |
          ls -l index.html data-jinshang.js data-suibi.js
          echo "---"
          grep -c "scroll-progress\|paper-noise" index.html || true

      - name: 提交并推送（若内容有变化）
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "无内容变更，跳过提交（Pages 已是最新）"
          else
            git add index.html data-jinshang.js data-suibi.js pictures
            git commit -m "chore: 从 CNB 同步最新页面（$(date +'%Y-%m-%d %H:%M:%S')）"
            git push origin main
            echo "已推送，GitHub Pages 将自动重新构建"
          fi

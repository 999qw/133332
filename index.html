<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵元贞集</title>
<!-- 安全策略：限制脚本来源；'unsafe-inline' 用于兼容页面内的 onclick 事件处理器 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://weavatar.com https://cravatar.cn https://www.gravatar.com https://sdn.geekzu.org https://gravatar.loli.net https://thirdqq.qlogo.cn https://owo.imaegoo.com https://cdn.jsdelivr.net; frame-src 'none'; connect-src 'self' https://zhaoyuan.netlify.app;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://zhaoyuan.netlify.app">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="data-jinshang.js" defer></script>
<script src="data-suibi.js" defer></script>
<script src="twikoo.min.js" defer></script>
<script src="app.js" defer></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --ink:        #1a1410;
  --ink-light:  #2a2218;
  --paper:      #e8dcc8;
  --paper-dim:  #c4b69c;
  --gold:       #c9a96e;
  --gold-light: #e0c992;
  --gold-dim:   #8b7355;
  --border-dim: rgba(201,169,110,0.12);
  --font-serif: 'Noto Serif SC','Source Han Serif SC','STSong',serif;
  --font-calligraphy: 'Ma Shan Zheng','STXingkai','FZKai-Z03','KaiTi',cursive;
  --reader-size: 1.05em;
  --reader-width: 880px;
  --font-sans:  'Noto Sans SC','PingFang SC',sans-serif;
  --nav-h: 64px;
  --side-pad: clamp(24px, 6vw, 80px);
}

html { scroll-behavior: smooth; background: var(--ink); }
body {
  font-family: var(--font-serif); color: var(--paper);
  background: var(--ink); overflow-x: hidden; line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

/* ===== Nav ===== */
nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  height: var(--nav-h);
  padding: 0 var(--side-pad);
  display:flex; align-items:center; justify-content:center;
  background: transparent;
  transition: background 0.4s, box-shadow 0.4s;
}
nav.scrolled {
  background: rgba(26,20,16,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 var(--border-dim);
}
.nav-links { display:flex; gap:2.5rem; }
.nav-links a {
  position:relative;
  font-family: var(--font-sans);
  font-size:0.82rem; font-weight:700; letter-spacing:0.08em;
  color:var(--paper-dim); text-decoration:none; text-transform:uppercase;
  padding:4px 0; cursor:pointer; transition:color 0.25s;
}
.nav-links a::after {
  content:''; position:absolute; bottom:0; left:0; right:0;
  height:1.5px; background:var(--gold);
  transform:scaleX(0); transform-origin:right;
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.nav-links a:hover { color:var(--gold); }
.nav-links a:hover::after { transform:scaleX(1); transform-origin:left; }
.nav-search {
  position:absolute; right:var(--side-pad); border:1px solid var(--border-dim);
  border-radius:999px; padding:7px 13px; background:transparent;
  color:var(--paper-dim); font-family:var(--font-sans); font-size:0.72rem;
  cursor:pointer; transition:color .25s, border-color .25s, background .25s;
}
.nav-search:hover { color:var(--gold); border-color:var(--gold-dim); background:rgba(201,169,110,.06); }

/* ===== Hero ===== */
.hero {
  position:relative; min-height:100vh;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.hero-bg {
  position:absolute; inset:0; background:var(--ink);
}
.hero-bg img {
  width:100%; height:100%; object-fit:cover;
  mix-blend-mode:overlay; opacity:0.35;
  filter:saturate(0.8) brightness(0.7);
  will-change:transform;
}
.hero-overlay {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, var(--ink) 80%);
}
.hero-content {
  position:relative; z-index:2; text-align:center; padding:0 var(--side-pad);
}
.hero-quote {
  font-family:var(--font-serif);
  font-size:clamp(0.85rem,1.3vw,1.05rem);
  color:var(--gold-dim); margin-bottom:1.8rem;
  min-height:1.8em; line-height:1.6; transition:opacity 0.5s;
}
.hero-quote::before { content:'\201C'; }
.hero-quote::after  { content:'\201D'; }
.hero-title {
  font-family:var(--font-calligraphy);
  font-size:clamp(4.2rem,14vw,10rem); font-weight:400;
  line-height:1.05; letter-spacing:0.12em; color:var(--paper); margin-bottom:1.2rem;
}
.hero-sub {
  font-size:clamp(0.9rem,1.4vw,1.15rem);
  color:var(--paper-dim); letter-spacing:0.15em;
}
.hero-scroll-indicator {
  position:absolute; bottom:2rem; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:6px; opacity:0.6;
  animation:bounceFloat 2.5s ease-in-out infinite;
}
.hero-scroll-indicator span {
  font-family:var(--font-sans); font-size:0.65rem;
  letter-spacing:0.2em; color:var(--gold-dim); text-transform:uppercase;
}
.hero-scroll-indicator .line {
  width:1px; height:28px;
  background:linear-gradient(to bottom,var(--gold-dim),transparent);
}

/* ===== Sections ===== */
section { padding:100px var(--side-pad); }
.section-header { text-align:center; margin-bottom:60px; }
.section-header .num {
  font-family:var(--font-sans); font-size:0.75rem;
  letter-spacing:0.25em; color:var(--gold-dim); margin-bottom:0.8rem;
}
.section-header h2 {
  font-size:clamp(1.8rem,4vw,3rem); font-weight:300;
  letter-spacing:0.08em; color:var(--paper);
}
.section-header .divider {
  width:40px; height:1.5px; background:var(--gold); margin:1rem auto 0;
}

/* ===== Book Cards ===== */
.books-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:clamp(16px,2vw,30px); max-width:1200px; margin:0 auto;
}
.book-card {
  position:relative; aspect-ratio:4/5; overflow:hidden; cursor:pointer;
  background:var(--ink-light); border:1px solid var(--border-dim);
  transition:border-color 0.4s, transform 0.5s cubic-bezier(0.4,0,0.2,1);
}
.book-card:hover { border-color:var(--gold-dim); transform:translateY(-4px); }
.book-card img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; mix-blend-mode:hard-light; opacity:0.25;
  transition:opacity 0.5s, transform 0.6s;
}
.book-card:hover img { opacity:0.4; transform:scale(1.05); }
.book-card .card-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, var(--ink) 10%, transparent 60%);
}
.book-card .card-content {
  position:absolute; bottom:0; left:0; right:0; padding:30px 28px;
}
.book-card .card-label {
  font-family:var(--font-sans); font-size:0.7rem;
  letter-spacing:0.2em; color:var(--gold-dim); margin-bottom:6px;
}
.book-card .card-title {
  font-size:clamp(1.3rem,2.2vw,1.8rem); font-weight:600;
  color:var(--paper); margin-bottom:4px;
}
.book-card .card-count { font-size:0.8rem; color:var(--paper-dim); }
.book-card .card-arrow {
  position:absolute; top:24px; right:24px;
  width:32px; height:32px; border:1px solid var(--border-dim);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.8rem; color:var(--gold-dim);
  transition:background 0.3s, color 0.3s, transform 0.3s;
}
.book-card:hover .card-arrow {
  background:var(--gold); color:var(--ink); transform:rotate(45deg);
}

/* ===== Separator ===== */
.separator {
  position:relative; height:50vh; min-height:320px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.separator img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; mix-blend-mode:overlay; opacity:0.25;
  filter:saturate(0.7) brightness(0.6); will-change:transform;
}
.separator .sep-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to bottom, var(--ink) 0%, transparent 30%, transparent 70%, var(--ink) 100%);
}
.separator .sep-text {
  position:relative; z-index:2;
  font-size:clamp(0.9rem,1.6vw,1.2rem); font-weight:300; line-height:1.7;
  max-width:720px; margin:0 auto; padding:0 var(--side-pad); text-align:center;
}
.separator .sep-text span { display:block; transition:opacity 0.6s; }

/* ===== Reading Area ===== */
.reading-area { display:none; }
.reading-area.active { display:block; }

/* Article list */
.article-list-section { padding:80px var(--side-pad); }
.article-list-section,
.article-view {
  opacity:1;
  transform:translateY(0);
  transition:opacity 0.35s ease, transform 0.35s ease;
}
.article-list-section.fade-out {
  opacity:0;
  transform:translateY(-12px);
  pointer-events:none;
}
.article-view.fade-out {
  opacity:0;
  transform:translateY(12px);
  pointer-events:none;
}
.article-list-header {
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:40px; max-width:900px; margin-left:auto; margin-right:auto;
}
.article-list-header h2 {
  font-size:clamp(1.4rem,2.5vw,2rem); font-weight:300; color:var(--paper);
}
.article-list-header .back-btn {
  font-family:var(--font-sans); font-size:0.78rem; font-weight:700;
  letter-spacing:0.08em; color:var(--gold-dim); cursor:pointer;
  text-decoration:none; text-transform:uppercase; transition:color 0.25s;
  background:none; border:none;
}
.article-list-header .back-btn:hover { color:var(--gold); }
.article-list-header .list-context { color:var(--gold-dim); font-family:var(--font-sans); font-size:.72rem; }
.reading-toolbar {
  max-width:900px; margin:0 auto 22px; display:flex; align-items:center;
  justify-content:space-between; gap:12px; color:var(--gold-dim);
  font-family:var(--font-sans); font-size:.74rem;
}
.reading-toolbar .toolbar-actions { display:flex; align-items:center; gap:6px; }
.reading-toolbar button, .search-close {
  border:1px solid var(--border-dim); border-radius:5px; padding:6px 9px;
  color:var(--paper-dim); background:transparent; cursor:pointer;
  font-family:var(--font-sans); font-size:.72rem;
}
.reading-toolbar button:hover, .search-close:hover { color:var(--gold); border-color:var(--gold-dim); }
.reading-toolbar .reading-mode { padding:0 8px; color:var(--paper-dim); }
.reader-paper { background:#eee4d2; color:#30271f; }
.reader-paper .article-view, .reader-paper .article-list-section { color:#30271f; }
.reader-paper .article-view h2, .reader-paper .article-view .article-body p { color:#30271f; }
.reader-paper .article-view .article-meta { color:#806b4b; border-color:rgba(70,48,25,.18); }
.reader-paper .article-view .article-body .annotation { color:#765e3b; background:rgba(92,65,31,.07); border-color:#9b7a4d; }
.article-list {
  max-width:960px; margin:0 auto;
  display:grid; gap:2px;
  background:var(--border-dim);
}
.article-list-item {
  background:var(--ink); padding:18px 24px;
  cursor:pointer; transition:background 0.25s;
  display:flex; justify-content:space-between; align-items:baseline; gap:16px;
}
.article-list-item:hover { background:var(--ink-light); }
.article-list-item .item-title {
  font-size:0.95rem; color:var(--paper); line-height:1.5;
}
.article-list-item .item-meta {
  font-family:var(--font-sans); font-size:0.72rem;
  color:var(--gold-dim); white-space:nowrap; flex-shrink:0;
}

/* Article reading */
.article-view {
  max-width:var(--reader-width); margin:0 auto; padding:60px var(--side-pad) 80px;
}
.article-view .article-back {
  display:inline-block;
  font-family:var(--font-sans); font-size:0.78rem; font-weight:700;
  letter-spacing:0.08em; color:var(--gold-dim); cursor:pointer;
  text-decoration:none; text-transform:uppercase; margin-bottom:40px;
  transition:color 0.25s; background:none; border:none;
}
.article-view .article-back:hover { color:var(--gold); }
.article-view h2 {
  font-size:clamp(1.4rem,2.5vw,2rem); font-weight:600;
  color:var(--paper); margin-bottom:8px;
}
.article-view .article-meta {
  font-family:'Microsoft YaHei','微软雅黑',sans-serif; font-size:0.82rem;
  color:var(--gold-dim); margin-bottom:32px;
  padding-bottom:16px; border-bottom:1px solid var(--border-dim);
}
.article-view .article-body p {
  margin-bottom:20px; text-indent:2em; line-height:2.2; letter-spacing:0.025em;
  font-size:var(--reader-size); color:var(--paper);
}
.article-view .article-body .annotation {
  font-family:'Kaiti SC','KaiTi','STKaiti','楷体',var(--font-serif),serif;
  color:var(--gold-dim); text-indent:0; font-size:0.95em;
  padding:8px 14px; margin-top:12px;
  background:rgba(201,169,110,0.06);
  border-left:2px solid var(--gold-dim);
  border-radius:0 4px 4px 0;
}
.article-view .comments-section {
  margin-top:48px; padding-top:24px;
  border-top:1px solid var(--border-dim);
}
.article-view .comments-section h3 {
  font-size:1em; font-family:var(--font-sans);
  color:var(--gold-dim); margin-bottom:16px; letter-spacing:0.1em;
}

/* ===== Twikoo 评论区（自建后端，访客填昵称即可评论） ===== */
#twikoo-container {
  --primary: #8b7355;
  --text: #e8dcc8;
  font-family: var(--font-serif);
  font-size: .95rem;
  color: var(--paper);
  margin-top: 4px;
}
#twikoo-container .tk-comments-title,
#twikoo-container .tk-comments-count { color: var(--paper-dim); }
#twikoo-container .tk-comment { border-bottom: 1px solid var(--border-dim); }
#twikoo-container .tk-nick,
#twikoo-container .tk-nick-link { color: var(--gold) !important; }
#twikoo-container .tk-time,
#twikoo-container .tk-action-link,
#twikoo-container .tk-actions a { color: var(--gold-dim) !important; }
#twikoo-container .tk-content { color: var(--paper); line-height: 1.8; }
#twikoo-container .tk-meta-input .el-input__inner,
#twikoo-container .tk-input textarea {
  background: rgba(255,255,255,.03) !important;
  border-color: var(--border-dim) !important;
  color: var(--paper) !important;
  font-family: var(--font-serif) !important;
}
#twikoo-container .tk-meta-input .el-input__inner:focus,
#twikoo-container .tk-input textarea:focus { border-color: var(--gold-dim) !important; }
#twikoo-container .tk-submit .el-button--primary {
  background: var(--gold-dim) !important;
  border-color: var(--gold-dim) !important;
  color: var(--ink) !important;
}
#twikoo-container .tk-submit .el-button--primary:hover {
  background: var(--gold) !important;
  border-color: var(--gold) !important;
}
#twikoo-container .tk-pagination .el-pager li.is-active { color: var(--gold) !important; }
#twikoo-container .tk-admin,
#twikoo-container .tk-admin-comment { color: var(--paper-dim); }
/* 暖纸模式下正文色跟随 */
.reader-paper #twikoo-container { --text: #30271f; color: #30271f; }
.reader-paper #twikoo-container .tk-content,
.reader-paper #twikoo-container .tk-meta-input .el-input__inner,
.reader-paper #twikoo-container .tk-input textarea { color: #30271f !important; }
.article-navigation { display:flex; justify-content:space-between; gap:16px; margin-top:44px; padding-top:22px; border-top:1px solid var(--border-dim); }
.article-navigation button { max-width:48%; border:0; background:none; color:var(--gold-dim); cursor:pointer; font-family:var(--font-serif); text-align:left; }
.article-navigation button:last-child { text-align:right; }
.article-navigation button:hover { color:var(--gold); }
.article-navigation small { display:block; font-family:var(--font-sans); font-size:.65rem; margin-bottom:4px; opacity:.8; }
.search-panel { position:fixed; inset:0; z-index:200; display:none; align-items:flex-start; justify-content:center; padding:12vh 20px 40px; background:rgba(8,6,4,.9); backdrop-filter:blur(12px); }
.search-panel.open { display:flex; }
.search-box { width:min(760px,100%); max-height:70vh; overflow:auto; padding:26px; background:#1b1510; border:1px solid rgba(201,169,110,.3); box-shadow:0 20px 70px rgba(0,0,0,.55); }
.search-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.search-head input { flex:1; min-width:0; border:1px solid rgba(201,169,110,.45); border-radius:5px; padding:13px 15px; background:#100d0a; color:var(--paper); font-family:var(--font-serif); font-size:1.12rem; outline:none; }
.search-head input:focus { border-color:var(--gold-dim); }
.search-result { display:flex; width:100%; box-sizing:border-box; flex-direction:column; gap:5px; padding:15px 10px; border:0; border-bottom:1px solid rgba(201,169,110,.16); background:transparent; color:var(--paper); cursor:pointer; text-align:left; font-family:var(--font-serif); }
.search-result:hover { background:rgba(201,169,110,.06); }
.search-result strong { color:#f1dfbd; font-size:1.12rem; font-weight:500; line-height:1.5; }
.search-result small { color:#b4956a; font-family:'Microsoft YaHei','微软雅黑',sans-serif; font-size:.78rem; line-height:1.5; }
.search-result span { color:#d1b98d; font-family:var(--font-serif); font-size:.94rem; line-height:1.75; letter-spacing:.02em; }
.search-empty { padding:28px 4px; color:var(--gold-dim); font-family:var(--font-serif); font-size:1rem; text-align:center; }
.comment-empty {
  font-family:var(--font-sans); font-size:0.82rem;
  color:var(--gold-dim); text-align:center; padding:24px 0;
}
#twikoo-container { min-height:120px; }
/* Twikoo 直接渲染在容器内（非 iframe）；暗色模式靠容器上的 data-theme="dark" 触发 */

/* ===== Footer ===== */
footer {
  padding:40px var(--side-pad);
  border-top:1px solid var(--border-dim);
  display:flex; justify-content:center;
  font-family:var(--font-sans); font-size:0.75rem; color:var(--gold-dim);
}
footer .footer-links { display:flex; gap:1.5rem; }
footer .footer-links a {
  color:var(--gold-dim); text-decoration:none; transition:color 0.25s;
}
footer .footer-links a:hover { color:var(--gold); }

/* ===== Animations ===== */
@keyframes bounceFloat {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50%     { transform:translateX(-50%) translateY(8px); }
}
.reveal {
  opacity:0; transform:translateY(40px);
  transition:opacity 0.8s, transform 0.8s cubic-bezier(0.4,0,0.2,1);
}
.reveal.visible { opacity:1; transform:translateY(0); }

/* ===== Responsive ===== */
@media (max-width:768px) {
  .nav-links { gap:1.2rem; }
  .nav-links a { font-size:0.7rem; }
  .books-grid { grid-template-columns:1fr; }
  .article-list-item { flex-direction:column; gap:4px; }
  .article-list-item .item-meta { white-space:normal; }
  .article-view { padding:40px 20px 60px; }
  .article-view .article-body p { font-size:1em; }
  .nav-search { right:18px; padding:6px 9px; }
  .reading-toolbar { align-items:flex-start; flex-direction:column; }
  .reading-toolbar .toolbar-actions { width:100%; justify-content:flex-end; }
  .article-navigation { margin-top:32px; }
}
@media (max-width:480px) {
  .nav-links { gap:.8rem; }
  .nav-search { font-size:0; width:30px; height:30px; padding:0; }
  .nav-search::before { content:'⌕'; font-size:1rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}
</style>
</head>
<body>

<!-- ===== Nav ===== -->
<nav id="navbar">
  <div class="nav-links">
    <a onclick="scrollToSection('books')">卷目</a>
    <a onclick="scrollToSection('reading')">阅读</a>
    <a onclick="scrollToSection('top')">首页</a>
  </div>
  <button class="nav-search" onclick="openSearch()" aria-label="搜索文章">搜索</button>
</nav>

<!-- ===== Hero ===== -->
<section class="hero" id="top">
  <div class="hero-bg">
    <img src="pictures/warm_graded/882ae6ed00a9f60fb26d172400997414.jpg" alt="" aria-hidden="true">
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-quote" id="heroQuote"></p>
    <h1 class="hero-title">
      <span>赵元贞集</span>
    </h1>
    <p class="hero-sub">今上实录 · 随笔 · 未分类</p>
  </div>
  <div class="hero-scroll-indicator">
    <span>滚动</span>
    <div class="line"></div>
  </div>
</section>

<!-- ===== Books ===== -->
<section id="books">
  <div class="section-header reveal">
    <p class="num">I · 卷</p>
    <h2>文集三卷</h2>
    <div class="divider"></div>
  </div>
  <div class="books-grid">
    <div class="book-card reveal" onclick="openBook('今上实录')">
      <img src="pictures/warm_graded/体仁阁.jpg" alt="" aria-hidden="true" style="object-position:center 30%;">
      <div class="card-overlay"></div>
      <div class="card-arrow">→</div>
      <div class="card-content">
        <p class="card-label">卷一</p>
        <h3 class="card-title">今上实录</h3>
        <p class="card-count">诗词 · 骈文 · 杂记</p>
      </div>
    </div>
    <div class="book-card reveal" onclick="openBook('随笔')">
      <img src="pictures/warm_graded/与谁同坐轩.jpg" alt="" aria-hidden="true" style="object-position:center 100%;">
      <div class="card-overlay"></div>
      <div class="card-arrow">→</div>
      <div class="card-content">
        <p class="card-label">卷二</p>
        <h3 class="card-title">随笔</h3>
        <p class="card-count">散文 · 杂感</p>
      </div>
    </div>
    <div class="book-card reveal" onclick="openBook('未分类')">
      <img src="pictures/warm_graded/嵩山.jpg" alt="" aria-hidden="true" style="object-position:center 35%;">
      <div class="card-overlay"></div>
      <div class="card-arrow">→</div>
      <div class="card-content">
        <p class="card-label">卷三</p>
        <h3 class="card-title">未分类</h3>
        <p class="card-count">杂文 · 考据</p>
      </div>
    </div>
  </div>
</section>

<!-- ===== Separator ===== -->
<div class="separator reveal">
  <img src="pictures/warm_graded/f166950c9955dc974e58a3da76e0492b.jpg" alt="" aria-hidden="true">
  <div class="sep-overlay"></div>
  <div class="sep-text"><span id="sepQuote"></span></div>
</div>

<!-- ===== Reading Area ===== -->
<section id="reading" class="reading-area">
  <!-- Article List (shown when a book is selected) -->
  <div id="articleList" class="article-list-section">
    <div class="article-list-header">
      <h2 id="listTitle">文集</h2>
      <button class="back-btn" onclick="closeBook()">← 返回卷目</button>
    </div>
    <div class="reading-toolbar" id="readingToolbar">
      <span class="list-context" id="readingContext">选择一卷开始阅读</span>
      <div class="toolbar-actions">
        <button onclick="adjustReadingSize(-0.05)" aria-label="缩小文字">A−</button>
        <span class="reading-mode" id="readingSizeLabel">标准</span>
        <button onclick="adjustReadingSize(0.05)" aria-label="放大文字">A+</button>
        <button onclick="toggleReaderTheme()" id="themeToggle">暖纸</button>
      </div>
    </div>
    <div class="article-list" id="articleListItems"></div>
  </div>

  <!-- Article View (shown when an article is selected) -->
  <div id="articleView" class="article-view" style="display:none;">
    <button class="article-back" onclick="showList()">← 返回目录</button>
    <h2 id="articleTitle"></h2>
    <div class="article-meta" id="articleMeta"></div>
    <div class="article-body" id="articleBody"></div>
    <div class="article-navigation">
      <button id="prevArticle" onclick="navigateArticle(-1)"><small>上一篇</small><span></span></button>
      <button id="nextArticle" onclick="navigateArticle(1)"><small>下一篇</small><span></span></button>
    </div>
    <div class="comments-section">
      <h3>评论区</h3>
      <div id="twikoo-container"></div>
    </div>
  </div>
</section>

<div id="searchPanel" class="search-panel" aria-hidden="true">
  <div class="search-box" role="dialog" aria-label="搜索文集">
    <div class="search-head">
      <input id="searchInput" type="search" placeholder="搜索标题或正文…" oninput="debouncedSearch(this.value)">
      <button class="search-close" onclick="closeSearch()">关闭</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- ===== Footer ===== -->
<footer class="reveal">
  <div class="footer-links">
    <a href="#top">返回首页</a>
    <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<!-- ===== JS ===== -->

</body>
</html>
